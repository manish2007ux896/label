  <text x="80" y="565" font-family="Arial, sans-serif" font-size="15" fill="#737373">Built for Indian E-Commerce Merchants • Surat • Jaipur • Delhi-NCR • Tirupur</text>
  <text x="1120" y="565" text-anchor="end" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#ea580c">100% FREE FOREVER</text>
