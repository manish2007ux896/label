  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#glow)" />

  <!-- Grid lines subtle -->
  <g stroke="#262626" stroke-width="1" opacity="0.4">
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="500" x2="1200" y2="500" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Brand Pill -->
  <rect x="80" y="75" width="270" height="42" rx="21" fill="#1c1917" stroke="#ea580c" stroke-width="1.5" />
  <circle cx="105" cy="96" r="6" fill="#ea580c" />
  <text x="125" y="102" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#f97316">SMARTLABELCROP.IN</text>

  <!-- Main Headline -->
  <text x="80" y="195" font-family="Arial, sans-serif" font-size="54" font-weight="900" fill="#ffffff">Free Meesho &amp; Flipkart</text>
  <text x="80" y="260" font-family="Arial, sans-serif" font-size="54" font-weight="900" fill="url(#accentGrad)">4×6 Thermal Label Cropper</text>

  <!-- Subheadline -->
  <text x="80" y="325" font-family="Arial, sans-serif" font-size="22" fill="#d4d4d4">Rescue hidden SKUs, stamp inverted multi-order pack alerts,</text>
  <text x="80" y="360" font-family="Arial, sans-serif" font-size="22" fill="#d4d4d4">and generate courier picklists in 1 click. 100% Client-Side WebAssembly.</text>

  <!-- Feature Tags -->
  <g transform="translate(80, 420)">
    <!-- Tag 1 -->
    <rect x="0" y="0" width="235" height="46" rx="8" fill="#171717" stroke="#333333" />
    <text x="20" y="29" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">★ Zero Missing Items</text>

    <!-- Tag 2 -->
    <rect x="250" y="0" width="245" height="46" rx="8" fill="#171717" stroke="#333333" />
    <text x="270" y="29" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">✓ 100% Vector Barcodes</text>

    <!-- Tag 3 -->
    <rect x="510" y="0" width="245" height="46" rx="8" fill="#171717" stroke="#333333" />
    <text x="530" y="29" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">🔒 100% Private (DPDP)</text>

    <!-- Tag 4 -->
    <rect x="770" y="0" width="230" height="46" rx="8" fill="#171717" stroke="#333333" />
    <text x="790" y="29" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">⚡ Valmo &amp; Ekart Ready</text>
