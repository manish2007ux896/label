<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Vibrant thermal orange gradient -->
    <linearGradient id="labelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    
    <!-- Subtle dark tile gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#171717" />
      <stop offset="100%" stop-color="#0A0A0A" />
    </linearGradient>

    <!-- Warm orange glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#EA580C" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Dark Rounded Squircle Base Container -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" stroke="#262626" stroke-width="2.5" />

  <!-- 4 Corner Precision Crop Marks (White) -->
  <g stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Top-Left Crop ┌ -->
    <path d="M 26 46 L 26 31 Q 26 26 31 26 L 46 26" />
    <!-- Top-Right Crop ┐ -->
    <path d="M 82 26 L 97 26 Q 102 26 102 31 L 102 46" />
    <!-- Bottom-Left Crop └ -->
    <path d="M 26 82 L 26 97 Q 26 102 31 102 L 46 102" />
    <!-- Bottom-Right Crop ┘ -->
    <path d="M 82 102 L 97 102 Q 102 102 102 97 L 102 82" />
  </g>

  <!-- Center 4x6 Thermal Label Sticker with Glow -->
  <rect x="42" y="38" width="44" height="52" rx="7" fill="url(#labelGrad)" filter="url(#glow)" />

  <!-- Minimal Barcode Lines & SKU Divider Inside Label -->
  <g fill="#FFFFFF" opacity="0.95">
    <!-- Thin Bar -->
    <rect x="49" y="46" width="3.5" height="22" rx="1" />
    <!-- Wide Bar -->
    <rect x="55.5" y="46" width="7" height="22" rx="1.5" />
    <!-- Medium Bar -->
    <rect x="65.5" y="46" width="4" height="22" rx="1" />
    <!-- Thin Bar -->
    <rect x="72.5" y="46" width="3.5" height="22" rx="1" />

    <!-- Horizontal SKU Rescue Barcode Divider -->
    <rect x="49" y="74" width="27" height="3.5" rx="1.5" />
  </g>
</svg>
